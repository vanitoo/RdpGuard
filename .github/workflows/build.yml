name: Build and Release RdpGuard

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build/release (example: v1.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Resolve ref and release tag
        id: meta
        shell: pwsh
        run: |
          $checkoutRef = "${{ github.ref }}"
          $releaseTag = ""

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}" -ne "") {
            $checkoutRef = "${{ inputs.tag }}"
            $releaseTag = "${{ inputs.tag }}"
          }
          elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $releaseTag = "${{ github.ref_name }}"
          }

          "checkout_ref=$checkoutRef" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./src/RdpGuard.csproj

      - name: Build
        run: dotnet build ./src/RdpGuard.csproj --configuration Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish ./src/RdpGuard.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish/win-x64

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./RdpGuard-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RdpGuard-win-x64
          path: ./RdpGuard-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.meta.outputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Publishing release for tag $env:RELEASE_TAG"

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release already exists; replacing ZIP asset."
            gh release upload $env:RELEASE_TAG ./RdpGuard-win-x64.zip --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          }
          else {
            Write-Host "Release does not exist; creating it."
            gh release create $env:RELEASE_TAG ./RdpGuard-win-x64.zip --verify-tag --generate-notes --title "RdpGuard $env:RELEASE_TAG" --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}"
