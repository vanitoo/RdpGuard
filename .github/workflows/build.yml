name: Build and Release RdpGuard

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build/release (example: v1.0.2)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseTag = ''

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}" -ne '') {
            $releaseTag = "${{ inputs.tag }}"
            git fetch --tags --force
            git checkout $releaseTag
            if ($LASTEXITCODE -ne 0) { throw "Unable to checkout requested tag $releaseTag" }
          }
          elseif ("${{ github.ref }}" -like 'refs/tags/v*') {
            $releaseTag = "${{ github.ref_name }}"
          }
          elseif ("${{ github.event_name }}" -eq 'push' -and "${{ github.ref }}" -eq 'refs/heads/main') {
            [xml]$project = Get-Content ./src/RdpGuard.csproj -Raw
            $version = [string]$project.Project.PropertyGroup.Version
            if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing in src/RdpGuard.csproj' }
            $releaseTag = "v$version"

            git fetch --tags --force
            $existing = git tag -l $releaseTag
            if (-not $existing) {
              Write-Host "Creating release tag $releaseTag for commit $env:GITHUB_SHA"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a $releaseTag -m "RdpGuard $releaseTag"
              git push origin $releaseTag
              if ($LASTEXITCODE -ne 0) { throw "Unable to push tag $releaseTag" }
            }
            else {
              Write-Host "Tag $releaseTag already exists; release assets will be refreshed."
            }
          }

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./src/RdpGuard.csproj

      - name: Build
        shell: pwsh
        run: dotnet build ./src/RdpGuard.csproj --configuration Release --no-restore -p:RdpGuardCommit=${{ github.sha }}

      - name: Publish win-x64
        shell: pwsh
        run: dotnet publish ./src/RdpGuard.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:RdpGuardCommit=${{ github.sha }} --output ./publish/win-x64

      - name: Add service scripts to published package
        shell: pwsh
        run: |
          Copy-Item ./install-service.ps1 ./publish/win-x64/install-service.ps1 -Force
          Copy-Item ./uninstall-service.ps1 ./publish/win-x64/uninstall-service.ps1 -Force

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./RdpGuard-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RdpGuard-win-x64
          path: ./RdpGuard-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.meta.outputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Publishing release for tag $env:RELEASE_TAG"

          $assets = @(
            './RdpGuard-win-x64.zip',
            './install-service.ps1',
            './uninstall-service.ps1'
          )

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; replacing assets.'
            gh release upload $env:RELEASE_TAG @assets --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          }
          else {
            Write-Host 'Release does not exist; creating it.'
            gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --title "RdpGuard $env:RELEASE_TAG" --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}"
