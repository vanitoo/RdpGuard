name: Build and Release RdpGuard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for manual run'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: rdpguard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve automatic version
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --tags --force

          # Pull requests only build/test. They never create a tag or Release.
          if ("${{ github.event_name }}" -eq 'pull_request') {
            [xml]$project = Get-Content ./src/RdpGuard.csproj -Raw
            $buildVersion = [string]$project.Project.PropertyGroup.Version
            if ([string]::IsNullOrWhiteSpace($buildVersion)) { $buildVersion = '0.0.0' }
            "release_tag=" >> $env:GITHUB_OUTPUT
            "build_version=$buildVersion" >> $env:GITHUB_OUTPUT
            "commit_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT
            Write-Host "PR build only | Version=$buildVersion"
            exit 0
          }

          # Find the highest stable semantic-version tag vMAJOR.MINOR.PATCH.
          $versions = @()
          foreach ($tag in @(git tag --list 'v*')) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $versions += [PSCustomObject]@{
                Tag = $tag
                Major = [int]$Matches[1]
                Minor = [int]$Matches[2]
                Patch = [int]$Matches[3]
              }
            }
          }

          if ($versions.Count -eq 0) {
            $major = 1
            $minor = 0
            $patch = 0
            $previousTag = '<none>'
          }
          else {
            $latest = $versions |
              Sort-Object Major, Minor, Patch -Descending |
              Select-Object -First 1
            $major = $latest.Major
            $minor = $latest.Minor
            $patch = $latest.Patch
            $previousTag = $latest.Tag
          }

          # Default: every push to main increments PATCH.
          # Commit-message controls:
          #   [minor] -> X.Y.Z becomes X.(Y+1).0
          #   [major] -> X.Y.Z becomes (X+1).0.0
          $bump = 'patch'
          if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            $requested = "${{ inputs.bump }}".Trim().ToLowerInvariant()
            if ($requested -in @('patch','minor','major')) { $bump = $requested }
          }
          else {
            $message = @'
${{ github.event.head_commit.message }}
'@
            if ($message -match '(?i)\[major\]') { $bump = 'major' }
            elseif ($message -match '(?i)\[minor\]') { $bump = 'minor' }
          }

          switch ($bump) {
            'major' {
              $major++
              $minor = 0
              $patch = 0
            }
            'minor' {
              $minor++
              $patch = 0
            }
            default {
              if ($previousTag -eq '<none>') {
                # First release starts at v1.0.0.
              }
              else {
                $patch++
              }
            }
          }

          $buildVersion = "$major.$minor.$patch"
          $releaseTag = "v$buildVersion"

          if (git tag --list $releaseTag) {
            throw "Calculated tag $releaseTag already exists. Refusing to overwrite a release tag."
          }

          Write-Host "Previous tag : $previousTag"
          Write-Host "Bump         : $bump"
          Write-Host "New version  : $buildVersion"
          Write-Host "Release tag  : $releaseTag"

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "build_version=$buildVersion" >> $env:GITHUB_OUTPUT
          "commit_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./src/RdpGuard.csproj

      - name: Build
        shell: pwsh
        run: >-
          dotnet build ./src/RdpGuard.csproj
          --configuration Release
          --no-restore
          -p:Version=${{ steps.meta.outputs.build_version }}
          -p:AssemblyVersion=${{ steps.meta.outputs.build_version }}.0
          -p:FileVersion=${{ steps.meta.outputs.build_version }}.0
          -p:InformationalVersion=${{ steps.meta.outputs.build_version }}
          -p:RdpGuardCommit=${{ steps.meta.outputs.commit_sha }}

      - name: Publish win-x64
        shell: pwsh
        run: >-
          dotnet publish ./src/RdpGuard.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.meta.outputs.build_version }}
          -p:AssemblyVersion=${{ steps.meta.outputs.build_version }}.0
          -p:FileVersion=${{ steps.meta.outputs.build_version }}.0
          -p:InformationalVersion=${{ steps.meta.outputs.build_version }}
          -p:RdpGuardCommit=${{ steps.meta.outputs.commit_sha }}
          --output ./publish/win-x64

      - name: Add service scripts to published package
        shell: pwsh
        run: |
          Copy-Item ./install-service.ps1 ./publish/win-x64/install-service.ps1 -Force
          Copy-Item ./uninstall-service.ps1 ./publish/win-x64/uninstall-service.ps1 -Force

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./RdpGuard-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RdpGuard-win-x64-${{ steps.meta.outputs.build_version }}
          path: ./RdpGuard-win-x64.zip
          if-no-files-found: error

      - name: Create and push release tag
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:RELEASE_TAG "${{ github.sha }}" -m "RdpGuard $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create tag $env:RELEASE_TAG" }
          git push origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Unable to push tag $env:RELEASE_TAG" }

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $assets = @(
            './RdpGuard-win-x64.zip',
            './install-service.ps1',
            './uninstall-service.ps1'
          )

          Write-Host "Creating GitHub Release $env:RELEASE_TAG"
          gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --title "RdpGuard $env:RELEASE_TAG" --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}"
