name: Build and Release RdpGuard

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build/release (example: v1.0.3). If missing, it will be created from current main.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag and build version
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseTag = ''
          $buildVersion = ''

          git fetch --tags --force

          if ("${{ github.event_name }}" -eq 'workflow_dispatch' -and "${{ inputs.tag }}" -ne '') {
            $releaseTag = "${{ inputs.tag }}".Trim()
            if ($releaseTag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
              throw "Invalid tag '$releaseTag'. Expected format like v1.0.3"
            }

            $buildVersion = $releaseTag.Substring(1)
            $existing = git tag -l $releaseTag

            if ($existing) {
              Write-Host "Tag $releaseTag exists; checking it out."
              git checkout --force $releaseTag
              if ($LASTEXITCODE -ne 0) { throw "Unable to checkout tag $releaseTag" }
            }
            else {
              Write-Host "Tag $releaseTag does not exist; creating it from current main commit $env:GITHUB_SHA"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a $releaseTag -m "RdpGuard $releaseTag"
              if ($LASTEXITCODE -ne 0) { throw "Unable to create tag $releaseTag" }
              git push origin $releaseTag
              if ($LASTEXITCODE -ne 0) { throw "Unable to push tag $releaseTag" }
            }
          }
          elseif ("${{ github.ref }}" -like 'refs/tags/v*') {
            $releaseTag = "${{ github.ref_name }}"
            $buildVersion = $releaseTag.Substring(1)
          }
          elseif ("${{ github.event_name }}" -eq 'push' -and "${{ github.ref }}" -eq 'refs/heads/main') {
            [xml]$project = Get-Content ./src/RdpGuard.csproj -Raw
            $buildVersion = [string]$project.Project.PropertyGroup.Version
            if ([string]::IsNullOrWhiteSpace($buildVersion)) { throw 'Version is missing in src/RdpGuard.csproj' }
            $releaseTag = "v$buildVersion"

            $existing = git tag -l $releaseTag
            if (-not $existing) {
              Write-Host "Creating release tag $releaseTag for commit $env:GITHUB_SHA"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a $releaseTag -m "RdpGuard $releaseTag"
              git push origin $releaseTag
              if ($LASTEXITCODE -ne 0) { throw "Unable to push tag $releaseTag" }
            }
            else {
              Write-Host "Tag $releaseTag already exists; release assets will be refreshed."
            }
          }
          else {
            [xml]$project = Get-Content ./src/RdpGuard.csproj -Raw
            $buildVersion = [string]$project.Project.PropertyGroup.Version
          }

          Write-Host "Release tag: $releaseTag"
          Write-Host "Build version: $buildVersion"
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "build_version=$buildVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./src/RdpGuard.csproj

      - name: Build
        shell: pwsh
        run: >-
          dotnet build ./src/RdpGuard.csproj
          --configuration Release
          --no-restore
          -p:Version=${{ steps.meta.outputs.build_version }}
          -p:InformationalVersion=${{ steps.meta.outputs.build_version }}
          -p:RdpGuardCommit=${{ github.sha }}

      - name: Publish win-x64
        shell: pwsh
        run: >-
          dotnet publish ./src/RdpGuard.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.meta.outputs.build_version }}
          -p:InformationalVersion=${{ steps.meta.outputs.build_version }}
          -p:RdpGuardCommit=${{ github.sha }}
          --output ./publish/win-x64

      - name: Add service scripts to published package
        shell: pwsh
        run: |
          Copy-Item ./install-service.ps1 ./publish/win-x64/install-service.ps1 -Force
          Copy-Item ./uninstall-service.ps1 ./publish/win-x64/uninstall-service.ps1 -Force

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./RdpGuard-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RdpGuard-win-x64
          path: ./RdpGuard-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.meta.outputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Publishing release for tag $env:RELEASE_TAG"

          $assets = @(
            './RdpGuard-win-x64.zip',
            './install-service.ps1',
            './uninstall-service.ps1'
          )

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release already exists; replacing assets.'
            gh release upload $env:RELEASE_TAG @assets --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          }
          else {
            Write-Host 'Release does not exist; creating it.'
            gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --title "RdpGuard $env:RELEASE_TAG" --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}"
